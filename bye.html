<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<title>またね！｜立命館OIC 鬼ごっこサークル</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--red:#e82c34;--blue:#1c48c4;--purple:#9a26d9;--paper:#faf8f4;--ink:#19161e;--muted:#6d6878;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font)}
main{min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;gap:20px;overflow:hidden;position:relative;
  padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
[hidden]{display:none!important}
.art{position:absolute;right:-22vw;bottom:-20vw;width:90vw;height:90vw;pointer-events:none;z-index:0}
main>*{position:relative;z-index:1}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.12em}
h1{margin:6vh 0 0;font-size:clamp(3rem,18vw,5rem);font-weight:900;color:var(--blue);line-height:1.05}
h1 .who{display:block;white-space:nowrap;overflow:hidden;color:var(--ink)}
.lead{margin:10px 0 0;font-size:1.15rem;font-weight:900}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px}
.stat b{display:block;font-size:clamp(2.6rem,14vw,3.6rem);font-weight:900;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.stat b small{font-size:.4em;color:var(--ink);margin-left:2px}
.stat span{font-size:.82rem;font-weight:700}
.feel{display:grid;gap:10px}
.feel p{margin:0;font-weight:900}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.faces button{font:inherit;font-weight:700;font-size:.85rem;padding:12px 4px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;line-height:1.4}
.faces button span{display:block;font-size:1.8rem}
.faces button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.faces button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.next{margin:0;font-size:.9rem;line-height:1.7}
.next a{color:var(--red);font-weight:900}
.foot{margin:0;font-size:.78rem;display:flex;gap:14px;align-items:center}
.foot a{color:var(--muted)}
.foot button{font:inherit;font-size:.78rem;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer}
.msg{background:#fff;border:1.5px solid var(--ink);padding:12px;font-size:.86rem;line-height:1.7}
</style>
</head>
<body>
<main>
  <svg class="art" viewBox="0 0 400 400" aria-hidden="true">
    <defs><clipPath id="cb"><circle cx="150" cy="200" r="140"/></clipPath></defs>
    <circle cx="150" cy="200" r="140" fill="#1c48c4"/><circle cx="270" cy="200" r="140" fill="#e82c34"/>
    <circle cx="270" cy="200" r="140" fill="#9a26d9" clip-path="url(#cb)"/>
  </svg>
  <div>
    <div class="eyebrow">RITSUMEIKAN OIC&nbsp; ONIGOKKO CIRCLE</div>
    <h1 id="bye">またね！</h1>
    <p class="lead" id="lead">おつかれさま！</p>
    <div class="stats" id="stats" hidden>
      <div class="stat" id="stayBox"><b id="stay">–</b><span>今日あそんだ時間</span></div>
      <div class="stat"><b id="count">–<small>回目</small></b><span>通算の参加</span></div>
    </div>
    <div class="msg" id="msg" hidden></div>
  </div>
  <div class="feel" id="feel" hidden>
    <p>今日はどうだった？（タップするだけ・任意）</p>
    <div class="faces" role="group" aria-label="今日の楽しさ">
      <button type="button" data-v="1" aria-pressed="false"><span>🙂</span>まあまあ</button>
      <button type="button" data-v="2" aria-pressed="false"><span>😆</span>たのしい</button>
      <button type="button" data-v="3" aria-pressed="false"><span>🔥</span>最高！</button>
    </div>
    <p class="next">次の鬼ごっこは <a id="ig" href="https://www.instagram.com/onigo12345/" target="_blank" rel="noopener">@onigo12345</a> でお知らせします。</p>
    <p class="foot"><a href="privacy.html">集めているデータ</a>　<button type="button" id="forget">わたしの記録を消す</button></p>
  </div>
</main>

<script src="vendor/supabase.js"></script>
<script src="config.js?v=20261105c"></script>
<script src="visit.js?v=20261105c"></script>
<script>
const $ = (id) => document.getElementById(id);
// 「〇〇、またね！」。長い名前は1行に収まるまで文字を小さくする
function showName(name) {
  const h = $("bye"); h.textContent = "";
  const who = document.createElement("span"); who.className = "who"; who.textContent = name + "、";
  h.append(who, "またね！");
  const fit = () => {
    who.style.fontSize = "";
    let size = parseFloat(getComputedStyle(who).fontSize);
    while (who.scrollWidth > who.clientWidth && size > 14) { size *= 0.94; who.style.fontSize = size + "px"; }
  };
  fit(); document.fonts?.ready.then(fit); addEventListener("resize", fit);
}
const fmt = (m) => m == null ? "–" : m >= 60 ? `${Math.floor(m / 60)}<small>時間</small>${m % 60}<small>分</small>` : `${m}<small>分</small>`;
async function leave(feeling) {
  try { return await window.Visit.leave(feeling); }
  catch (e) { console.warn(e); return null; }
}
(async () => {
  const r = await leave();
  if (!r) { $("msg").hidden = false; $("msg").textContent = "記録できませんでした。電波の良い場所で、もう一度QRを読み込んでね。"; return; }
  if (!r.known) {
    $("msg").hidden = false;
    $("msg").textContent = "今日は来た時のQRを読んでいなかったみたい。次は、来た時のQRで手を撮るところから参加してね！";
    $("feel").hidden = false; return;
  }
  if (r.nickname) showName(r.nickname);
  $("stats").hidden = false; $("feel").hidden = false;
  $("stay").innerHTML = fmt(r.minutes);
  if (r.minutes == null) $("stayBox").hidden = true;
  $("count").innerHTML = `${r.visits}<small>回目</small>`;
})();
// わたしの記録を消す（2回押しで確定）
let armed = false;
$("forget").addEventListener("click", async () => {
  const b = $("forget");
  if (!armed) { armed = true; b.textContent = "本当に消す（もう一度押す）"; setTimeout(() => { armed = false; b.textContent = "わたしの記録を消す"; }, 4000); return; }
  b.disabled = true;
  try {
    await window.Visit.forget();
    document.querySelector("main").innerHTML = `<div><div class="eyebrow">RITSUMEIKAN OIC&nbsp; ONIGOKKO CIRCLE</div><h1>消しました。</h1>
      <p class="lead">アンケート・来場の記録・画像を消しました。また遊びに来てね！</p></div>`;
  } catch (e) { console.warn(e); b.disabled = false; b.textContent = "消せませんでした。もう一度押してね"; }
});
document.querySelector(".faces").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(".faces button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  await leave(+b.dataset.v);
});
</script>
</body>
</html>
